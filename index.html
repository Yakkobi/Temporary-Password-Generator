<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="title1">
      <div class = "titleOnePart1">Temporary</div>
      <div class = "passwordGenerator"> Password Generator </div>
    </div>

    <div id="outputField">
      <div class="output">Your Generated Password Appears here</div>

      <div class="copyButton">
        <button>Copy Password</button>
      </div>

      <div class="generateButton">
        <button>Generate New Password</button>
      </div>
    </div>

    <div id="optionsContainer">
      <div class="optionsText">
        <div class="textOption">Include Text</div>
        <div>Numbers</div>
        <div>Symbol Replace</div>
      </div>

      <div class="optionsInputs">
        <div class="textInputField">Input Field</div>
        <div>~Slider~</div>
  <input type="checkbox" id="symbolReplace" name="symbolReplace" value="on" checked>
      </div>
    </div>
 
    <div id="title2">
      <div class = titleTwoPart1>Secure</div>
      <div class = "passwordGenerator"> Password Generator </div>
    </div>


    <div id="outputField2">
      <div class="output2">Your Generated Password Appears here</div>

      <div class="copyButton2">
        <button>Copy Password</button>
      </div>

      <div class="generateButton2">
        <button>Generate New Password</button>
      </div>
    </div>

    
    <div id="optionsContainer2">
      <div class="optionsText">
        <div class="lengthOption">Length</div>
        <div>Letters</div>
        <div>Numbers</div>
        <div>Symbols</div>
      </div>

      <div class="optionsInputs">
        <div class="lengthOption">~Slider~</div>
  <input type="checkbox" id="lettersOption" name="lettersOption" value="on" checked>
  <input type="checkbox" id="numbersOption" name="numbersOption" value="on" checked>
  <input type="checkbox" id="SymbolsOption" name="SymbolsOption" value="on" checked>
      </div>

    <script src="script.js"></script>
  </body>
</html>
