<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RhinoPass</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="rhinoPassTitle">
      <div class="titleSpacer"></div>
      <div class="titleText">Rhino Pass</div>
      <img src="/Assets/Rhino.png" alt="Rhino" />
    </div>

    <div id="title1">
      <div class="titleOnePart1">Temporary</div>
      <div class="passwordGenerator">Password Generator</div>
    </div>

    <div id="outputField">
      <input type="text" class="output" />

      <div class="copyButton">
        <button>Copy Password</button>
      </div>

      <div class="generateButton">
        <button>Generate New Password</button>
      </div>
    </div>

    <div id="optionsContainer">
      <div class="optionRow">
        <div>Numbers</div>
        <div class="sliderGroup">
          <input
            type="range"
            class="numbersSlider"
            min="1"
            max="12"
            value="2"
          />
          <div class="numbersSliderValue">2</div>
        </div>
      </div>

      <div class="optionRow">
        <div class="textOption">Include Year</div>
        <input
          type="checkbox"
          id="includeYear"
          name="includeYear"
          value="off"
        />
      </div>
      <div class="optionRow">
        <div>Replace A/a with "@"</div>
        <input
          type="checkbox"
          id="replaceA"
          name="replaceA"
          value="on"
          checked
        />
      </div>
      <div class="optionRow">
        <div>Replace S/s with "$"</div>
        <input
          type="checkbox"
          id="replaceS"
          name="replaceS"
          value="on"
          checked
        />
      </div>
    </div>

    <div id="title2">
      <div class="titleTwoPart1">Secure</div>
      <div class="passwordGenerator">Password Generator</div>
    </div>

    <div id="outputField2">
      <input type="text" class="output2" />

      <div class="copyButton2">
        <button>Copy Password</button>
      </div>

      <div class="generateButton2">
        <button>Generate New Password</button>
      </div>
    </div>

    <div id="optionsContainer2">
      <div class="optionRow2">
        <div class="lengthOption">Length</div>
        <div class="sliderGroup">
          <input
            type="range"
            class="lengthSlider"
            min="1"
            max="24"
            value="12"
          />
          <div class="lengthValue">12</div>
        </div>
      </div>
      <div class="optionRow2">
        <div>Letters</div>
        <input
          type="checkbox"
          id="lettersOption"
          name="lettersOption"
          value="on"
          checked
        />
      </div>
      <div class="optionRow2">
        <div>Numbers</div>
        <input
          type="checkbox"
          id="numbersOption"
          name="numbersOption"
          value="on"
          checked
        />
      </div>
      <div class="optionRow2">
        <div>Symbols</div>
        <input
          type="checkbox"
          id="symbolsOption"
          name="symbolsOption"
          value="on"
          checked
        />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
